<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Get-Joke</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</head>
<body class="bg-warning">
    <div class="container mt-5">

    <h1 class="text-center">Random Joke Generator</h1>

    <div class="card mt-4 p-4 shadow">

      <h4 class="text-center">Setup</h4>
      <p id="setup" class="text-center text-danger"></p>

     <h4 class="mt-3 text-center">Punchline</h4>
     
      <p id="punchline" class="text-center text-primary"></p>
      
    <button type="button" class="btn btn-info" onclick="getJoke()">Get Joke</button>

    </div>

  </div>

  
  <script>

 function getJoke() {
  fetch("https://official-joke-api.appspot.com/random_joke")
    .then(function(response) {
      return response.json();
    })
    .then(function(data) {
      document.getElementById("setup").innerHTML  = data.setup;
      document.getElementById("punchline").innerHTML  = data.punchline;
    });
}



  </script>
</body>
</html>
